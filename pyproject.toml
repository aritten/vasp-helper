[project]
name = "vasp-helper"
version = "0.2.0"
description = "A group of scripts that create input files and preform some post-processing steps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas"]

[project.scripts]
vasphelper = "vasphelper.vasp_helper:main"
diffinputmaker = "vasphelper.diff_input_maker:main"
icoreinputmaker = "vasphelper.icore_input_maker:main"
atomfreezer = "vasphelper.atom_freezer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]